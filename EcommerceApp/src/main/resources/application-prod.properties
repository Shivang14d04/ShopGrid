spring.application.name=EcommerceApp

# Database configuration (Supabase PostgreSQL via Pooler for IPv4 compatibility)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.xjivofvtlmaumlqxcuvw}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.auto-commit=false

# Redis Configuration (Upstash Redis)
spring.data.redis.host=${REDIS_HOST:many-ladybird-129522.upstash.io}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:default}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:true}

# JWT Authentication
app.jwt.secret=${JWT_SECRET:4c9f1f6e8b0f3a5d9e2c7f1a4b8d6e3f5a9c2d7e1b4f8a6c3d9e7f2a1b5c8d4e}
app.jwt.expiration-ms=86400000

# Admin User Defaults
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.email=${APP_ADMIN_EMAIL:admin@shop.com}
app.admin.password=${APP_ADMIN_PASSWORD:admin@1234}

# Spring AI (Google Gemini)
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.model=${GOOGLE_CHAT_MODEL:gemini-3.6-flash}
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.model=${GOOGLE_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=768

# Vector Store Initialization
spring.sql.init.schema-locations=classpath:init/schema.sql
spring.sql.init.mode=always
spring.main.allow-bean-definition-overriding=true

# File upload size limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
